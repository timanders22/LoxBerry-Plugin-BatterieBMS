[AUTHOR]
NAME=Batterie-BMS Plugin Authors
EMAIL=batteriebms@users.noreply.github.com

[PLUGIN]
VERSION=0.9.14
NAME=batteriebms
FOLDER=batteriebms
TITLE=Batterie-Heimspeicher (BMS)

[AUTOUPDATE]
# Selbstaktualisierung ueber das EIGENE Repository. Beide Adressen zeigen auf
# den Zweig master - LoxBerry liest die Fassung dort und vergleicht sie mit der
# oben. Solange beide dieselbe Fassung fuehren, wird niemandem etwas angeboten;
# sobald der Zweig eine hoehere fuehrt, greift die Aktualisierung von selbst.
# (Bis 0.9.6 stand hier eine feste 0.9.0 - eine Zahl im Kommentar, die mit
# jedem Release falscher wird.)
#
# Wichtig: Adressen NIE auf ein fremdes Repository richten. LoxBerry vergleicht
# Fassungen als Zahl, und ein fremdes 2021.05.14 waere groesser als 1.0.0 -
# daraus wuerde ein stilles Downgrade (Hausregel, belegt am Docker-Plugin).
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-BatterieBMS/master/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-BatterieBMS/master/prerelease.cfg

[SYSTEM]
INTERFACE=2.0
REBOOT=false
# Ab LoxBerry 3 ist das MQTT-Gateway Systembestandteil. Mit dieser Untergrenze
# darf die Fallunterscheidung im Code entfallen (Hausregel Punkt 4).
LB_MINIMUM=3.0.0
# LB_MAXIMUM bricht die Installation ab, nicht nur mit einer Warnung. Ohne
# belegten Grund fuer eine Obergrenze steht hier false.
LB_MAXIMUM=false
ARCHITECTURE=false
