L_VORLAGE_GERAET = "Für welchen Speicher?"
MEHRERE = "Mehrere Speicher: je Speicher ein virtueller Eingang mit eigener Adresse."
S1_TEXT = "Es gibt zwei Wege, und sie schließen sich nicht aus. <b>MQTT ist der Regelweg:</b> das Gateway erzeugt die Namen der virtuellen Eingänge selbst, in Loxone genügt ein passend benannter Eingang. <b>Der HTTP-Endpunkt</b> ist der zweite Weg; ihn braucht man ohnehin, sobald Loxone etwas schalten soll, und er ist für die Statuswerte oft übersichtlicher, weil eine einzige Abfrage alle Werte auf einmal liefert. Wer nur zusieht, nimmt MQTT. Wer steuert, richtet beides ein."
