[LOX]
ADRESSE_VORSCHLAG = "Die Adresse oben ist ein <b>Vorschlag</b>. Der Rechnername, unter dem der Browser gerade zugreift, muss nicht derselbe sein, unter dem der Miniserver den LoxBerry erreicht. Im Zweifel die feste IP-Adresse des LoxBerry eintragen."
EINLEITUNG = "Diese Seite baut die Anbindung Schritt für Schritt auf. Wer sie von oben nach unten abarbeitet, hat am Ende einen Speicher, der seine Zellspannungen nach Loxone meldet und sich vom Miniserver zum Laden zwingen lässt."
H_TITEL = "Einbindung in Loxone"
IMPORT_WARNUNG = "<b>Loxone Config legt beim Import neu an und überschreibt nichts.</b> Zweimal importiert heißt doppelte Objekte. Vor einem zweiten Import die alten löschen."
K_TOKEN_NEU = "Neues Token würfeln"
K_VORLAGE_AUS = "Importdatei virtueller Ausgang"
K_VORLAGE_EIN = "Importdatei virtuelle Eingänge"
L_VORLAGE_GERAET = "Für welchen Speicher?"
MEHRERE = "Mehrere Speicher: je Speicher ein virtueller Eingang mit eigener Adresse."
S1_TEXT = "Es gibt zwei Wege, und sie schließen sich nicht aus. <b>MQTT ist der Regelweg:</b> das Gateway erzeugt die Namen der virtuellen Eingänge selbst, in Loxone genügt ein passend benannter Eingang. <b>Der HTTP-Endpunkt</b> ist der zweite Weg; ihn braucht man ohnehin, sobald Loxone etwas schalten soll, und er ist für die Statuswerte oft übersichtlicher, weil eine einzige Abfrage alle Werte auf einmal liefert. Wer nur zusieht, nimmt MQTT. Wer steuert, richtet beides ein."
S1_TITEL = "Schritt 1: Weg festlegen"
S2_TEXT = "Nur nötig, wenn der MQTT-Weg benutzt wird. Die Themengruppe dieses Plugins lautet:"
S2_TITEL = "Schritt 2: Das Abo im MQTT-Gateway"
S3_BEFEHLE = "<p>Die Befehlserkennungen für den virtuellen Eingang. Der Knopf unten erzeugt sie fertig als Importdatei — die Tabelle bleibt trotzdem stehen, denn sie erklärt, was importiert wird.</p>"
S3_STRICH = "Ein <b>Strich</b> statt einer Zahl bedeutet: der Speicher hat dieses Feld nicht geliefert. Es wird bewusst keine 0 gesendet, denn eine 0 wäre eine stille Falschaussage. Loxone behält bei einem Strich den letzten Wert."
S3_TEXT = "In Loxone Config einen <b>Virtuellen HTTP Eingang</b> anlegen. Adresse und Zyklus:"
S3_TITEL = "Schritt 3: Virtuelle Eingänge anlegen"
S4_TEXT = "Nur nötig, wenn Loxone den Speicher zum Laden oder Entladen zwingen soll. Einen <b>Virtuellen Ausgang</b> anlegen und darunter je einen Befehl. Der Wertplatzhalter für die Leistung heißt in Loxone <span class='sm-mono'>&lt;v.0&gt;</span>."
S4_TITEL = "Schritt 4: Befehle senden"
S4_WARNUNG = "<b>watt=0 ist etwas anderes als laden mit 0 Watt:</b> es beendet den Zwang und gibt die Regie an den Speicher zurück. Ein Wert über der eingestellten Grenze wird <b>abgewiesen</b>, nicht gekappt — sonst glaubte der Miniserver, es sei mehr gesendet worden. <b>Nach dem Import prüfen</b>, ob bei jedem Befehl als Methode GET eingetragen ist: die geprüften Muster im Arbeitsordner sind UDP-Ausgänge und führen dieses Attribut nicht, deshalb schreibt die Importdatei es auch nicht."
S5_TEXT = "Der Endpunkt liegt im unangemeldeten Bereich, damit Loxone ihn ohne Zugangsdaten erreicht. Geschützt ist er durch das Token, das in jeder Adresse steckt."
S5_TEXT2 = "<p><b>Ein neues Token macht alle Adressen im Miniserver ungültig.</b> Nach dem Würfeln müssen sie in Loxone Config von Hand nachgezogen werden. Deshalb nur würfeln, wenn das Token wirklich abhandengekommen ist.</p>"
S5_TITEL = "Schritt 5: Token und Totmannschaltung"
S6_TEXT = "Virtuelle Eingänge behalten in Loxone ihren letzten Wert. Fällt der Speicher aus, sieht in der App deshalb alles normal aus — der Ladezustand steht nur still. Zwei Werte verraten es: <span class='sm-mono'>ALTER</span> steigt, und <span class='sm-mono'>OK</span> fällt auf 0. Beide gehören ausgewertet, siehe Bausteine 7 bis 13 unten. <b>Die Schwelle für die Ausfallmeldung deutlich über den Abholtakt legen</b>, damit ein einzelner verpasster Durchlauf keine Meldung auslöst."
S6_TITEL = "Schritt 6: Ausfallerkennung"
S7_ERLAEUTERUNG = "<h3>Zu den einzelnen Zeilen</h3><p><b>Zu 9 und 10:</b> Zwei verschiedene Fehlerbilder. #9 heißt: der Dienst läuft, holt aber keine frischen Werte mehr. #10 heißt: der Dienst läuft und meldet ausdrücklich, dass der Speicher nicht antwortet. Beide führen zur selben Meldung, deshalb werden sie in #11 zusammengeführt.</p><p><b>Zu 11:</b> <b>Niemals mehrere Quellen unmittelbar an den Eingang des Benachrichtigungs-Bausteins legen.</b> Er sendet nur beim Wechsel von Aus auf Ein; eine dauerhaft aktive Quelle verschluckt sonst alle übrigen. Erst über ODER zusammenführen.</p><p><b>Zu 12 und 15:</b> Die Einschaltverzögerung ist kein Beiwerk. Ohne sie meldet die Anlage bei jedem einzelnen verpassten Abruf und bei jeder Lastspitze, die die Zellspannungen kurz auseinanderzieht.</p><p><b>Zu 14:</b> Der Abstand zwischen höchster und niedrigster Zellspannung ist der Wert, wegen dessen man ein BMS überhaupt ausliest. Unter Last geht er auch bei gesunden Zellen auseinander — aussagekräftig ist er im Ruhezustand. Wer es genau nimmt, verknüpft #14 zusätzlich mit der Bedingung, dass die Batterieleistung nahe null liegt.</p><p><b>Zu 21:</b> Der Spotpreis kommt aus dem Plugin Spotpreis aWATTar oder einer gleichwertigen Quelle. Wer keinen dynamischen Tarif hat, lässt 21 bis 25 weg und schaltet 27 allein über den Merker 26.</p><p><b>Zu 27:</b> Alle drei Bedingungen müssen zusammenkommen: der Preis ist niedrig, der Speicher ist noch nicht voll genug, und die Freigabe steht. Fehlt eine, endet der Zwang.</p><p><b>Zu 30 bis 32 und 36:</b> Das ist die Totmannschaltung. Der Impulsgeber sendet, solange der Zwang laufen soll, regelmäßig ein Lebenszeichen. <b>Der Takt muss deutlich kürzer sein als die eingestellte Totmannzeit</b> — ein Drittel ist ein brauchbarer Wert. Bleibt das Lebenszeichen aus, weil der Miniserver ausfällt oder das Netz weg ist, fällt der Speicher von selbst in die Automatik zurück. Ohne diesen Teil bleibt ein Ladezwang stehen, bis jemand ihn bemerkt.</p><p><b>Zu 34 und 35:</b> Endet die Bedingung, wird die Automatik <b>ausdrücklich</b> gesendet, statt auf die Totmannzeit zu warten. Die Totmannschaltung ist das Netz darunter, nicht der Regelweg.</p><p><b>Loxone-Zeitrechnung:</b> Loxone zählt Sekunden seit dem 01.01.2009. Liefert ein Zeit-Baustein Unix-Zeit (ein Wert um 1,7 Milliarden), sind <span class='sm-mono'>1230768000</span> abzuziehen.</p><p>Alle Bausteine findet Loxone Config über die Baustein-Suche mit <b>F5</b>.</p>"
S7_TEXT = "<b>Pflichtteil.</b> Wer diese Tabelle von oben nach unten abarbeitet, hat die Funktion nachgebaut, ohne nachzudenken. Die Zeilen 1 bis 20 sind die Überwachung und lohnen sich immer. Die Zeilen 21 bis 36 sind das Laden nach Spotpreis samt Totmannschaltung — sie können entfallen, wenn nur zugesehen werden soll."
S7_TITEL = "Schritt 7: Komplette Baustein-Liste zum Nachbauen"
S8_TEXT = "Diese vier Adressen im Browser aufrufen. Die erste muss Werte liefern, die anderen drei müssen abgewiesen werden. Wird eine der letzten drei beantwortet, stimmt etwas mit dem Endpunkt nicht."
S8_TITEL = "Schritt 8: Gegenprobe"
TOKEN_NEU = "Es wurde ein neues Token gewürfelt. Alle Adressen im Miniserver müssen jetzt nachgezogen werden."
