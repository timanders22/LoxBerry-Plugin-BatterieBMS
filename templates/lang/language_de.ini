H_STEUERUNG = "Steuerung"
H_STEUERUNG_EIN = "Ohne diesen Haken beantwortet der Endpunkt jeden schreibenden Befehl mit einer Ablehnung. Zusätzlich muss je Speicher die Spalte Schreiben auf ja stehen — zwei Schalter, damit ein versehentlicher Klick nicht reicht. <b>Die Rücknahme ist nie gesperrt:</b> automatik, watt=0, die Totmannschaltung und das Anhalten des Dienstes geben den Speicher auch dann zurück, wenn einer der beiden Schalter aus ist. Wer einen Schalter während eines Zwangs abschaltet, beendet ihn damit spätestens nach der Totmannzeit."
