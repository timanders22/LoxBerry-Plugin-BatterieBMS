WEICHE_V1 = "<b>Gemessen: MQTT-Gateway V1.</b> Das Plugin trägt seine Themengruppe <span class='sm-mono'>%s/#</span> selbst in die Abo-Datei ein (Rückfall für V1). Hausform ist das MQTT-Gateway V2 – nach dem Umstieg die Datenpunkte der Hakenliste anhaken."
WEICHE_V2 = "<b>Gemessen: MQTT-Gateway V2.</b> Die Datenpunkte der Themengruppe <span class='sm-mono'>%s</span> erscheinen in den Subscriptions, sobald etwas veröffentlicht wurde – dort die Datenpunkte der Hakenliste anhaken (status/ok und geraet1/ok „Noncached“). Die Abo-Datei ist nur noch der Rückfall für Gateway V1."
