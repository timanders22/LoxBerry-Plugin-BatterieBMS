H_HUAWEI = "Über den Smart Dongle auf Port 502, im WLAN-Zugangspunkt des Wechselrichters je nach Firmware auf 502 oder 6607. Es gibt keinen unmittelbaren Zugang zum BMS: der Wechselrichter reicht durch, was er durchreicht."
H_HUAWEI_PAKETE = "Die Registeradressen stehen seit 0.9.16 so, wie das Herstellerdokument sie führt (Solar Inverter Modbus Interface Definitions, SUN2000MA, Tabelle 3-2), gegengelesen an huawei-solar-lib. An einem Gerät gemessen sind sie hier nicht. Bis 0.9.15 waren sieben der acht Adressen falsch: der Speicher lieferte Zahlen, aber die falschen. Zellspannungen und einen Paket-SOH gibt es in diesem Adressraum nicht, sie sind deshalb entfallen. Vor dem Gebrauch mit dem Rohregister-Leser im Reiter Test gegen die Anzeige der FusionSolar-App halten."
H_PYLONTECH = "RS485-Konsole, kein Modbus. Ein USB-RS485-Adapter am LoxBerry, 115200 Baud bei US2000C und neuer, 9600 bei älteren Fassungen. Einen Gesundheitszustand liefert das Protokoll nicht: er wird aus der gemeldeten Gesamtkapazität und der eingetragenen Nennkapazität gerechnet."
H_SUNGROW = "Sungrow SBR über den SH-Hybridwechselrichter (Modbus-TCP, Port 502, Unit-ID 1) – <b>ungeprüft am Gerät</b>. Registerangaben aus dem Sungrow-Protokoll V1.1.11 (Protokolladressen = Dokument minus 1, gelesen mit FC 4). Keine Zelltemperatur: der Temperaturschutz nimmt die Pack-Temperatur. Das Vorzeichen der Leistung ist im Dokument nicht beschrieben – den Schalter „Vorzeichen“ am Gerät prüfen. Schreiben: Zwangsbetrieb über 13049/13050/13051; „sperren“ ist Entladen mit 0 W (am Gerät ungemessen)."
H_VICTRON = "Victron GX (Cerbo, Venus) – Batteriedienst, etwa Pylontech über CAN. <b>Ungeprüft am Gerät.</b> Unit-ID ab Werk 225; seit Venus 2.60 vergibt der GX sie je Anlage – unter Settings → Integrations → Modbus TCP server → Available services ablesen und beim Speicher eintragen. Nur lesen: die GX-Registerliste kennt keinen Batterie-Sollwert in W."

