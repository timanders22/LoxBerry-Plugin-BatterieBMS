FEHLER_VORLAGE_NR = "Die Speichernummer für die Vorlage muss 1 bis 6 sein - keine Vorlage erzeugt."
VON_HINWEIS = "<b>Schreiber-Wache:</b> jede Adresse oben trägt <span class='sm-mono'>&amp;von=loxone</span> – daran unterscheidet das Plugin den Miniserver von anderen Schreibern. Bei bestehenden Befehlen in Loxone Config genügt es, <span class='sm-mono'>&amp;von=loxone</span> von Hand anzuhängen (neu einlesen legt die Bausteine doppelt an). Die Betriebsart-Adresse ist für EVCC und trägt <span class='sm-mono'>&amp;von=evcc</span>. Ohne <span class='sm-mono'>von</span> geht jede Adresse weiter."
