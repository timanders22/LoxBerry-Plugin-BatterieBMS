TS_HINWEIS = "<b>Zum Thema <span class='sm-mono'>ts</span>:</b> es trägt die Unixzeit des letzten Durchlaufs. Der Endpunkt für den Miniserver liefert stattdessen <span class='sm-mono'>ALTER</span> in Sekunden; über MQTT ginge das nicht, denn beim Senden ist das Alter immer null. Loxone rechnet in Sekunden seit dem 01.01.2009 - das Alter ergibt sich dort als (Loxone-Zeit + 1230768000) - ts. Ohne diesen Wert bleiben die zuletzt gesendeten Werte im Broker stehen, wenn der Dienst stirbt, und in der App sieht dann alles normal aus."
