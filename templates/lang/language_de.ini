BL_W1 = "Werte über das MQTT-Gateway V2: im Reiter MQTT „Werte über MQTT“ einschalten und im MQTT-Gateway V2 die Datenpunkte der Hakenliste anhaken (status/ok und geraet1/ok „Noncached“)."
BL_W2 = "Eine Seite „BatterieBMS“ anlegen und die Virtuellen Eingänge #1–#6, #22–#29 und #40 mit den Namen aus der Namenstabelle (Reiter Einbindung) anlegen – „Als Digitaleingang verwenden“ nicht anhaken; den Befehl „BMS: Automatik (Zwang beenden)“ (#21) am Ausgang „LoxBerry MQTT-Gateway“."
BL_W3 = "Virtuellen Eingang #20 „Zwang beenden“ neu anlegen: Peripherie → Virtuelle Eingänge, Eingabeart Taster, „In Visualisierung verwenden“ an."
BL_W4 = "Drei Benachrichtigungen (#12, #19, #39) anlegen: Peripherie → Mitteilungen → Benachrichtigung, Namen wie in der Tabelle, dann auf die Seite ziehen."
BL_W5 = "Die übrigen Bausteine über die Baustein-Suche (F5) setzen – darunter Konstante #41 und Analogwertvalidierung #42 (Haken bei „En“ entfernen) –, die Parameter wie in der Tabelle einstellen und jede Zeile nach der letzten Spalte verbinden."
BL_W6 = "Damit „BMS: Automatik (Zwang beenden)“ wirkt: im Reiter MQTT „%s“ setzen, im Reiter Einstellungen „%s“ setzen und beim Speicher die Spalte „%s“ auf ja stellen."
BL_HW1 = "Alle Störungen laufen über ODER in eine Benachrichtigung; ein Benachrichtigungsbaustein bekommt nur eine Quelle."
BL_HW2 = "Die Einschaltverzögerungen melden erst, wenn die Störung anhält – ein einzelner verpasster Abruf oder kurze Warnbits beim Lastwechsel bleiben still."
BL_HW3 = "Akku prüfen meldet bei Zelldrift (erst nach 30 Minuten), Gesundheit unter 80 Prozent oder Zelle über 45 °C; die Driftschwelle an die Warnschwelle im Reiter Einstellungen angleichen. Aussagekräftig ist die Drift in Ruhe – unter Last gehen auch gesunde Zellen kurz auseinander."
BL_HW4 = "BMS-Alarm meldet, was das BMS selbst meldet (Fehler- und Warnbits), eine Zelle unter der Ladegrenze und einen unvollständigen Zwang; die Einzelheiten zeigt der Reiter Test."
BL_HW5 = "Zwang beenden ist ein Taster in der App und schickt „BMS: Automatik (Zwang beenden)“."
BL_HW6 = "Status: die erste erfüllte Zeile gewinnt; die Zeile ohne Bedingung steht unten."
BL_HW7 = "Ein Ausgangsbefehl darf in Loxone nur einmal eingefügt werden: „BMS: Automatik (Zwang beenden)“ steht nur auf dieser Seite, „BMS: Laden erzwingen (W)“ und „BMS: Lebenszeichen“ nur auf der zweiten. Virtuelle Eingänge wie batteriebms_geraet1_ok dürfen auf beiden Seiten stehen."
BL_HW8 = "Haben Sie den Abruftakt über 36 s gestellt, setzen Sie bei „Werte veraltet“ (#8) Ein auf das Fünffache des Takts und Aus 30 s darunter."
BL_S1 = "In Loxone Config eine zweite Seite „BatterieBMS Spotpreis-Laden“ anlegen."
BL_S2 = "Spotpreis aWATTar: den Virtuellen Eingang spot_awattar_cur mit dem Namen aus der Namenstabelle des Plugins Spotpreis aWATTar anlegen – der Endpreis (mit Netzentgelt, Abgaben und USt), dieselbe Größe wie haus/strompreis/aktuell."
BL_S3 = "Die Virtuellen Eingänge batteriebms_geraet1_ok und batteriebms_geraet1_soc ein zweites Mal (#1, #2), spot_awattar_cur (#3) und batteriebms_geraet1_sollart (#19) auf die Seite ziehen; die Befehle „BMS: Laden erzwingen (W)“ (#14) und „BMS: Lebenszeichen“ (#17) am Ausgang „LoxBerry MQTT-Gateway“ anlegen."
BL_S4 = "Virtuelle Eingänge neu anlegen (Peripherie → Virtuelle Eingänge, „In Visualisierung verwenden“ an): drei Schieberegler #4, #6 und #12 mit Min, Max und Schritt wie in der Tabelle (Einheit: #4 <v.1> ct/kWh, #12 <v> W, #6 <v> %) und einen Schalter #8."
BL_S5 = "Nach dem Speichern in der App die Startwerte einmal einstellen (28 ct/kWh, 80 Prozent, 2000 W) – Loxone sendet einen Wert erst, wenn er sich ändert."
BL_S6 = "Die übrigen Bausteine über F5 setzen (2 Kleiner, 4 UND, 1 Formel, 1 Impulsgeber, 1 Status) und jede Zeile nach der letzten Spalte verbinden."
BL_S7 = "Im Reiter MQTT „%s“ setzen, im Reiter Einstellungen „%s“ setzen und beim Speicher die Spalte „%s“ auf ja stellen; die Totmannzeit (ab Werk 300 s) so lassen."
BL_HS1 = "„BMS: Laden erzwingen (W)“ sendet Loxone nur, wenn sich der Wert ändert. Endet der Zwang, geht die Formel auf 0, und 0 gibt die Regie an den Speicher zurück."
BL_HS2 = "Das Lebenszeichen hält den Zwang. Bleibt es länger als die Totmannzeit aus (Miniserver oder Netz weg), kehrt der Speicher von selbst in die Automatik zurück."
BL_HS3 = "„Kleiner“ hat keine Hysterese: am Ziel-Ladezustand kann der Zwang in einer günstigen Stunde einige Male an- und ausgehen; die Schreibbremse des Plugins (ab Werk 20 s) begrenzt das."
BL_HS4 = "spot_awattar_cur ist der Endpreis mit Netzentgelt, Abgaben und USt – dazu passt die Startgrenze 28 ct/kWh. Nicht zusammen mit „Spotpreis-Laden im Plugin“ (Reiter Einstellungen) benutzen – Befehle aus Loxone haben dort Vorrang."
BL_HS5 = "Die Ladeleistung nicht über die Leistungsgrenze des Speichers im Reiter Einstellungen stellen – ein höherer Wert wird abgewiesen, nicht gekappt."
BL_HS6 = "Prozentangaben heißen in Namen ‚(Proz)‘, weil Config ‚%‘ in ‚_‘ umwandelt – etwa der Regler „Ziel-Ladezustand (Proz)“."
BL_HS7 = "Störungen meldet die erste Seite (Meldung BMS gestört; ein unvollständiger Zwang über Meldung BMS-Alarm) – diese Seite hat keine eigene Benachrichtigung."
