WAS_IST_DAS = "<b>Liest das Batterie-Management-System eines Hausspeichers unmittelbar aus</b> – Ladezustand, Gesundheitszustand, Zellspannungen und -temperaturen, Zelldrift, Zyklen. Ein Dienst auf dem LoxBerry fragt die Speicher über Modbus TCP oder RTU bzw. die RS485-Konsole ab (BYD Battery-Box, Huawei LUNA2000, Pylontech, frei einstellbar über Profildateien). Die Werte gehen über MQTT und einen tokengeschützten HTTP-Endpunkt an den Miniserver; nach zweifacher Freigabe zwingt das Plugin einen Speicher auch zum Laden oder Entladen, etwa mit einem Spotpreistarif – mit Leistungsgrenze, Ladefenster und Totmannschaltung."
