PLATZHALTER = "N steht für die Nummer des Speichers, M für die Modulnummer, Z für die Zellnummer. Ein Messwert, den das Gerät nicht liefert, wird gar nicht gesendet — nicht als 0. Ein Zustand oder Text, der leer wird, geht als Strich (-) hinaus, damit Loxone den alten Wert nicht behält."
THEMEN_ERKLAERUNG = "Der Dienst schickt die Werte über den UDP-Eingang des Gateways. Das Plugin braucht dafür keine Zugangsdaten des Brokers zu kennen, die hat das Gateway ohnehin. <b>Gesendet wird nur, was sich geändert hat</b>, der volle Satz höchstens alle 10 Minuten (und nach jedem Dienststart oder Speichern), das Lebenszeichen <span class='sm-mono'>ts</span> höchstens alle 30 s. <b>Abgeräumt</b> werden zurückbehaltene Themen, wenn ein Speicher aus der Liste fällt (geraetN), EVCC abgeschaltet wird (evcc), das Präfix wechselt (das alte Präfix) oder MQTT abgeschaltet wird (das eigene Präfix). Ein ausgefallener Speicher behält seine Zustände, nur ok wird 0."
TS_HINWEIS = "<b>Zum Thema <span class='sm-mono'>ts</span>:</b> es trägt die Unixzeit des letzten Durchlaufs. Der Endpunkt für den Miniserver liefert stattdessen <span class='sm-mono'>ALTER</span> in Sekunden; über MQTT ginge das nicht, denn beim Senden ist das Alter immer null. Loxone rechnet in Sekunden seit dem 01.01.2009 - das Alter ergibt sich dort als (Loxone-Zeit + 1230768000) - ts. Ohne diesen Wert bleiben die zuletzt gesendeten Werte im Broker stehen, wenn der Dienst stirbt, und in der App sieht dann alles normal aus."
T_RETAINED = "Zurückbehalten"
RETAINED_JA = "ja"
RETAINED_NEIN = "nein"
RETAINED_ZAHL = "%d der %d Themen gehen zurückbehalten (retained) hinaus: die Zustände. So steht der Stand in Loxone auch nach einem Neustart des Miniservers oder des Gateways sofort wieder da. Messwerte und das Lebenszeichen gehen bewusst ohne Retain hinaus — ein alter Messwert, der als aktueller erscheint, ist schlimmer als gar keiner."
