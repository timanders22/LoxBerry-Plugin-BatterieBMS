H_WACHE = "Schreiber-Wache"
WACHE_ERKLAERUNG = "Den Speicher soll nur <b>ein</b> Regler führen. Die Wache merkt sich bei jedem schaltenden Befehl am Endpunkt, wer ihn schickt: die Kennung aus <span class='sm-mono'>&amp;von=</span> (die Loxone-Vorlage setzt <span class='sm-mono'>von=loxone</span>, die EVCC-Adresse <span class='sm-mono'>von=evcc</span>) und die Absenderadresse. Kommen innerhalb des Zeitfensters Befehle von mehr als einem Schreiber, steht das im Protokoll, im Reiter Test und hinten in der Antwort (<span class='sm-mono'>;SCHREIBER=n</span>). <b>Abgewiesen wird ab Werk nichts.</b> Erst „Fremde Schreiber abweisen“ weist ab – Rücknahmen (automatik, watt=0, batteriemodus=1) nie."
