S3_STRICH = "Ein <b>Strich</b> statt einer Zahl bedeutet: der Speicher hat dieses Feld nicht geliefert. Es wird bewusst keine 0 gesendet, denn eine 0 wäre eine stille Falschaussage. Loxone behält bei einem Strich den letzten Wert."
