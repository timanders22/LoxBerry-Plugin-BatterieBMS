MQTT_ERSTER_SCHRITT_AUS = "<b>Erster Schritt für den MQTT-Weg:</b> im Reiter MQTT den Haken „Werte über das MQTT-Gateway veröffentlichen“ setzen. Er ist ab Werk aus und steht jetzt auf <b>aus</b> — das Plugin sendet nichts."
