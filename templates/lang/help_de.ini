; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Batterie-Heimspeicher (BMS)"
K02 = "Liest das <b>Batterie-Management-System</b> eines Hausspeichers unmittelbar aus — Zellspannungen, Zelltemperaturen, Zyklenzahl und Gesundheitszustand — und kann den Speicher auf Wunsch zum Laden oder Entladen zwingen."
K03 = "Der Wechselrichter reicht davon meist nur einen Bruchteil durch. Wer wissen will, ob eine einzelne Zelle abfällt, muss das BMS selbst fragen."
K04 = "Drei Übertragungswege"
K05 = "<b>Modbus TCP</b> — Huawei LUNA2000 über den SUN2000-Wechselrichter, Port 502 am Smart Dongle."
K06 = "<b>Modbus RTU im TCP-Strom</b> — die BYD-BCU auf <span class='sm-mono'>192.168.16.254:8080</span>. Das ist kein Schreibfehler: die Box spricht RTU-Rahmen ohne MBAP-Kopf. Sie liegt außerdem in einem eigenen Teilnetz, also braucht der Router eine <b>statische Route</b> auf <span class='sm-mono'>192.168.16.0/24</span>. Und es kommt immer nur <b>eine</b> Anwendung gleichzeitig an die Box: solange BE Connect Plus oder ein Node-RED-Ablauf läuft, bleibt dieses Plugin draußen."
K07 = "<b>RS485-Konsole</b> — Pylontech US2000, US3000, US5000 und Force. Kein Modbus, sondern ein eigenes ASCII-Protokoll. Ein USB-RS485-Adapter am LoxBerry genügt; der Benutzer <span class='sm-mono'>loxberry</span> muss in der Gruppe <span class='sm-mono'>dialout</span> sein."
K08 = "So gehen Sie vor"
K09 = "<b>Einstellungen:</b> Speicher eintragen, Profil wählen, speichern, dann <i>Dienst starten</i>."
K10 = "<b>Test:</b> Die Selbstprüfung sagt Zeile für Zeile, ob es trägt. Jedes Kreuz nennt die Abhilfe mit."
K11 = "<b>Test, Rohregister lesen:</b> Bevor Sie einem Profil glauben — Register lesen und den Wert gegen die Anzeige des Herstellers halten."
K12 = "<b>MQTT:</b> Das Abo <span class='sm-mono'>batteriebms/#</span> (bzw. das eigene Präfix) trägt das Plugin selbst in <span class='sm-mono'>config/plugins/batteriebms/mqtt_subscriptions.cfg</span> ein, beim Speichern und beim Dienststart. <b>Unter MQTT&#8209;Gateway&nbsp;V1</b> kommt ohne dieses Abo am Miniserver nichts an. Ob Fassung&nbsp;2 die Themengruppe auch ohne die Datei erkennt, ist nicht gemessen."
K13 = "<b>Einbindung in Loxone:</b> Schritt für Schritt, mit vollständiger Baustein-Liste und einem Knopf, der die Importdatei für Loxone Config erzeugt."
K14 = "Profile"
K15 = "Jedes Geräteprofil sagt, <b>woher seine Registeradressen stammen</b> und ob sie gegen ein Gerät geprüft sind. Profile mit dem Stand <i>ungeprüft</i> sind im Umlauf, aber nicht gemessen — sie werden angeboten, damit man sie ausprobieren kann, nicht damit man ihnen glaubt."
K16 = "Ein eigenes Profil ist eine <b>JSON-Datei</b> im Ordner <span class='sm-mono'>data/plugins/batteriebms/profile/</span> und braucht keine Änderung am Quelltext. Im Reiter Einstellungen lädt ein Knopf jedes vorhandene Profil als Vorlage herunter."
K17 = "Steuerung und Totmannschaltung"
K18 = "Schreibende Befehle brauchen <b>zwei</b> Freigaben: den Haken im Reiter Einstellungen und die Spalte <i>Schreiben</i> beim einzelnen Speicher. Ein Wert über der eingestellten Grenze wird <b>abgewiesen</b>, nicht gekappt."
K19 = "Ein laufender Zwang endet von selbst, wenn länger als die <b>Totmannzeit</b> kein Lebenszeichen kommt. Loxone sendet dieses Lebenszeichen im Takt eines Impulsgebers — fällt der Miniserver aus, das Netz weg oder wird der Dienst angehalten, geht der Speicher in die Automatik zurück. Ohne diesen Teil bliebe ein Ladezwang stehen, bis jemand ihn bemerkt."
K20 = "Was diese Fassung nicht belegen kann"
K21 = "Sie ist an <b>keinem</b> Speicher gemessen worden. Belegt sind die Protokolle (Rahmenbau und Prüfsummen sind gegen die Originalfassungen gehalten) und die Registeradressen der Profile mit dem Stand <i>dokumentiert</i>. Nicht belegt ist, ob sie zu Ihrer Gerätefirmware passen und ob die Schreibbefehle dort tun, was ihr Name sagt."
K22 = "<b>MQTT veröffentlichen:</b> Wer über MQTT anbinden will, setzt als Erstes im Reiter MQTT den Haken „Werte über das MQTT-Gateway veröffentlichen“. Er ist ab Werk <b>aus</b> - ohne ihn sendet das Plugin nichts, auch wenn Dienst und Gateway laufen."
K23 = "<b>Ladezustandsfenster auch während eines Zwangs:</b> erreicht der Speicher während eines Entladezwangs die untere Grenze oder während eines Ladezwangs die obere, nimmt der Dienst den Zwang zurück (Automatik) und schreibt eine Zeile ins Protokoll."
K24 = "<b>Die Rücknahme ist nie gesperrt:</b> <span class='sm-mono'>automatik</span>, <span class='sm-mono'>watt=0</span>, die Totmannschaltung und das Anhalten des Dienstes geben den Speicher auch dann zurück, wenn die Schreibfreigabe aus ist. Die Freigaben sperren nur das <b>Setzen</b> eines Zwangs - auch ein Lebenszeichen wird dann abgewiesen, und die Totmannschaltung beendet den Zwang."
K25 = "<b>Speicherliste umbauen:</b> der Dienst merkt sich zu jedem Zwang die Adresse des Speichers. Solange ein Zwang läuft, weist das Speichern eine Änderung ab, die den Speicher von seiner Nummer verdrängen würde. Fällt er trotzdem aus der Liste (Sicherung, kaputte Konfiguration), nimmt der Dienst den Zwang über die gespeicherte Adresse zurück oder meldet laut, dass es nicht ging."
K26 = "<b>Anhalten, Update, Deinstallation:</b> <span class='sm-mono'>dienst.sh stop</span> wartet je Speicher die doppelte Zeitüberschreitung (mindestens 10 s). Bleibt ein Zwang offen, meldet es das mit dem Speichernamen und Rückgabewert 3, und der Sollmerker bleibt stehen, damit der Dienst es erneut versucht. Ein Update sichert offene Sollwerte und spielt sie zurück, Update und Deinstallation melden einen offenen Zwang als Warnung. Nach einer Deinstallation nimmt niemand mehr einen Zwang zurück - dann am Gerät auf Automatik stellen. SOLLART 4 heißt unvollständig: eine Schrittfolge brach ab, und auch die Rücknahme scheiterte."
K27 = "MQTT: was gesendet und was abgeräumt wird"
K28 = "Gesendet wird nur, was sich geändert hat, der volle Satz höchstens alle 10 Minuten, das Lebenszeichen <span class='sm-mono'>ts</span> höchstens alle 30 s. Zurückbehaltene Themen werden einmal geleert, wenn ein Speicher aus der Liste fällt (<span class='sm-mono'>geraetN/</span>), EVCC abgeschaltet wird (<span class='sm-mono'>evcc/</span>), das Präfix wechselt (das alte Präfix, es wird vermerkt und bei der Deinstallation noch einmal geleert) oder MQTT abgeschaltet wird (das eigene Präfix). Fällt nur das BMS aus, bleiben die Zustände stehen, und <span class='sm-mono'>ok</span> wird 0."
K29 = "<b>Benachrichtigung bei offenem Zwang:</b> scheitert nach Ablauf der Totmannzeit die Rücknahme in die Automatik, legt der Dienst zusätzlich zur Protokollzeile <b>eine</b> LoxBerry-Benachrichtigung ab (roter Punkt am Plugin) – einmal je Zwang, also vom Setzen bis zur gelungenen Rücknahme. Ebenso für einen Zwang, dessen Speicher nicht mehr in der Liste steht. Mit Totmannzeit 0 gibt es keine Frist und keine Meldung. Die drei Rücknahmen (<span class='sm-mono'>automatik</span>, <span class='sm-mono'>watt=0</span>, <span class='sm-mono'>batteriemodus=1</span>) nimmt der Endpunkt auch vor dem ersten Abruf an, sobald der Speicher in den Einstellungen steht; alle anderen schaltenden Befehle antworten dann weiter mit 503."
K30 = "<b>Notbremse:</b> Reiter Test, <i>Zwang jetzt überall aufheben</i> (rot, nur mit Haken). Stellt jeden eingerichteten Speicher über den Dienst in die Automatik – derselbe Weg wie <span class='sm-mono'>aktion=automatik</span> – und sagt je Speicher, ob es gelang. Ohne laufenden Dienst geschieht nichts."
K31 = "<b>Beanstandet:</b> weist das Speichern einen Wert ab, wird nichts gespeichert – auch die übrigen Felder nicht –, die eingetippten Werte stehen aber wieder im Formular und das beanstandete Feld ist rot umrandet. <i>Einstellungen sichern</i> warnt gelb am Knopf, wenn ein gespeicherter Wert das Zurückspielen nicht bestünde; die Sicherung wird trotzdem geliefert, ihr Kopf <span class='sm-mono'>_warnung</span> nennt die Namen."
K32 = "<b>Schreiber-Wache</b> (ab Werk: melden an, abweisen aus): schaltende Befehle am Endpunkt tragen wahlweise <span class='sm-mono'>&amp;von=&lt;kennung&gt;</span> (1 bis 32 Zeichen A-Z a-z 0-9 _ -; ungültig: HTTP 400 <span class='sm-mono'>ERR=VON</span>). Die Vorlage setzt <span class='sm-mono'>von=loxone</span>, die EVCC-Adresse <span class='sm-mono'>von=evcc</span>. Kommen im Zeitfenster (ab Werk 15 min) Befehle von mehreren Schreibern (Kennung@Adresse), steht das im Protokoll, im Reiter Test (Schreiber der letzten 24 Stunden) und hinten in der Antwort (<span class='sm-mono'>;SCHREIBER=n</span>); wahlweise auch als LoxBerry-Meldung. Lässt sich der Merker nicht schreiben, geht der Befehl trotzdem (<span class='sm-mono'>;WACHE=MERKER</span>). Kein MQTT-Thema."
K33 = "<b>Führung und Abweisen:</b> Führung „Loxone“ heißt: Sollwerte von EVCC (<span class='sm-mono'>batteriemodus</span> oder <span class='sm-mono'>von=evcc</span>) und von anderen Kennungen werden gemeldet; „EVCC“ umgekehrt; ab Werk gilt beides wie bisher. Erst mit „Fremde Schreiber abweisen“ (ab Werk aus) bekommt ein solcher Sollwert – oder einer, dessen Schreiber nicht in der Liste steht – HTTP 409 <span class='sm-mono'>GRUND=FREMDSCHREIBER</span> und wird nicht ausgeführt. Rücknahmen (<span class='sm-mono'>automatik</span>, <span class='sm-mono'>watt=0</span>, <span class='sm-mono'>batteriemodus=1</span>) gehen immer, ebenso Totmannschaltung und Notbremse."
