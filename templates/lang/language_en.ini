AUTOSTART_EIN = "The gateway is set to autostart."
GATEWAY_ERKLAERUNG = "Since LoxBerry 3 the MQTT gateway is <b>part of the system</b>, not a plugin. It is not installed but enabled under <b>System → MQTT Gateway</b>. Brokerhost defaults to localhost — so checking it does not answer whether messages can arrive. Only autostart does."
H_ABO = "The subscription in the MQTT gateway"
H_THEMEN = "All published topics"
H_ZUSTAND = "Gateway state"
NICHT_GEFUNDEN = "No MQTT section found in the LoxBerry general.json. On LoxBerry 3 and later it should be there — please check under System → MQTT Gateway."
PLATZHALTER = "N is the battery number, M the module number, Z the cell number. A measured value the device does not supply is not sent at all — not as 0. A state or text that becomes empty goes out as a dash (-), so that Loxone does not keep the old value."
THEMEN_ERKLAERUNG = "The service sends the values through the UDP input of the gateway. The plugin therefore needs no broker credentials of its own, the gateway has them anyway. <b>Only changes are sent</b>, the full set at most every 10 minutes (and after every service start or save), the keep alive <span class='sm-mono'>ts</span> at most every 30 s. Retained topics are <b>cleared</b> when a battery drops out of the list (geraetN), EVCC is switched off (evcc), the prefix changes (the old prefix) or MQTT is switched off (the own prefix). A failed battery keeps its states, only ok becomes 0."
TS_HINWEIS = "<b>About the topic <span class='sm-mono'>ts</span>:</b> it carries the Unix time of the last poll cycle. The endpoint for the Miniserver offers <span class='sm-mono'>ALTER</span> in seconds instead; over MQTT that would not work, because at the moment of sending the age is always zero. Loxone counts seconds since 01/01/2009 - the age there is (Loxone time + 1230768000) - ts. Without this value the values last sent stay in the broker when the service dies, and everything looks normal in the app."
T_RETAINED = "Retained"
RETAINED_JA = "yes"
RETAINED_NEIN = "no"
RETAINED_ZAHL = "%d of the %d topics are sent retained: the states. That way Loxone has the current state immediately after a restart of the Miniserver or the gateway. Measurements and the heartbeat are deliberately sent without retain — a stale measurement that looks current is worse than none."
