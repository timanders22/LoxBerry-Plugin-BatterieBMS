UNGEPRUEFT = "This release has not been measured against <b>any</b> battery. What is documented are the protocols and the register addresses of the profiles marked <i>documented</i> &mdash; the source is stated with each. What is not established is whether they match your device firmware, in which direction your device reports current and power as positive, and whether the write commands do there what their name says. Before the first forced command: read the raw registers, compare the values with the manufacturer display, start with a small power value."
