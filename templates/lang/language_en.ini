; Battery home storage (BMS) - English language file
;
; English is the FALLBACK language, not German: whoever runs a third language
; is more likely to understand English. This file must therefore always be
; complete.
;
; Rules (house standard):
;   - EVERY value is wrapped in double quotes. With parse_ini_file a ';'
;     starts a comment, so an unquoted value would be cut off there.
;   - No further double quote inside a value. Quote HTML attributes with
;     single quotes: <span class='sm-mono'>.
;   - Every key used in the PHP code exists in BOTH language files.

