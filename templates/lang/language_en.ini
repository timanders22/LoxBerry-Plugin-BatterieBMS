GERAETE_ERKLAERUNG = "One battery per row. The profile decides which fields are needed: an address for Modbus, a device file for Pylontech. Empty fields fall back to the profile default. A row is dropped only if it is completely empty (Write ‘No’, sign normal). Profiles marked (!) have not been verified against a device."
GERAETE_HILFE = "<b>Nominal capacity</b> is only needed for Pylontech — the state of health is computed from it. <b>Limits</b> in watts cap what a forced command may request; 0 means no limit of your own. <b>Sign</b> flips the reading if your battery reports charging as negative: the house default is positive = charging."
GESPEICHERT = "Settings saved."
H_DIENST = "Polling service"
H_DRIFT_WARNUNG = "From this spread between highest and lowest cell voltage the Test tab shows a cross. On a healthy lithium battery the value at rest is usually well below 30 mV; under load it rises even on healthy cells."
H_EVCC_GERAET = "EVCC knows exactly one home battery. The number from the device list above."
H_EVCC_LADEWATT = "Used when EVCC sends mode 3 without naming a power. 0 means the command is refused rather than guessed."
H_GERAETE = "Batteries"
H_INTERVALL = "How often the service fetches the base values. Cell voltages are fetched less often, see below."
H_PROFILE = "Device profiles"
H_PROFIL_DATEI = "Any existing profile works as a template: click <i>Download</i> in the table above, edit it, upload it here."
H_PROFIL_IMPORT = "Add your own profile"
H_SCHREIBBREMSE = "Minimum gap between two write commands to the same battery. Loxone likes to send every second; a BMS does not. Within the throttle the setpoint is still refreshed so the dead man switch does not fire. In addition, always: the same setpoint from the endpoint is not sent again at all within 60 s (answer with UNVERAENDERT=1, setpoint refreshed); returning to automatic always goes out."
H_SICHERUNG = "Backup of the settings"
H_SOC_MAX = "At or above this state of charge a forced charge is rejected. The configured value itself already counts. This also applies <b>during</b> a running override: when the battery reaches the limit, the service takes the override back and writes a line to the log."
H_SOC_MIN = "At or below this state of charge a forced discharge is rejected. The configured value itself already counts. This also applies <b>during</b> a running override: when the battery reaches the limit, the service takes the override back and writes a line to the log."
H_STEUERUNG = "Control"
H_STEUERUNG_EIN = "Without this checkbox the endpoint rejects every write command. In addition the column Write must be set to yes for each battery — two switches, so that one stray click is not enough. <b>Taking an override back is never blocked:</b> automatik, watt=0, the dead man switch and stopping the service return the battery even if one of the two switches is off. Switching one off during an override ends it at the latest after the dead man time."
H_TAKT = "Timing and limits"
H_TEMP_MAX = "Above this the plugin blocks forced charging and discharging and withdraws a running override; the collective flag reports. This is a <b>setting</b>, not a reading – 45 °C matches the threshold the block list on the Loxone integration tab suggests."
H_TEMP_MIN = "Below this the plugin blocks a forced charge and withdraws a running one; the collective flag reports. The BMS blocks anyway – this is the second line. Allowed -30 to 30 °C."
H_TOTMANN = "If a forced mode goes without a keep alive for longer than this, the service puts the battery back into automatic. 0 disables the dead man switch — then a forced mode stays in place even if the Miniserver fails. A keep alive is rejected while one of the two switches is off. For every override the service remembers the address of the battery: if the row is removed or the list moves up, it takes the override back through that address or reports loudly that it could not."
H_WARTEZEIT = "How long the endpoint waits for the service to answer before reporting an unknown result. It never reports a success nobody verified."
H_ZELLTAKT = "On the BYD BCU cell voltages cost five extra requests plus a wait. They change slowly — every few minutes is enough."
KONFIG_ZURUECK = "The settings were restored, %d batteries. Restart the service afterwards."
