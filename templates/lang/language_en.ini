W_TITEL = "Values through the MQTT gateway V2 – name table"
W_TEXT = "The values reach the Miniserver through the MQTT gateway V2: one virtual input per topic with the name the gateway assigns. Under gateway V2 tick the data points (column “V2 tick”, status/ok and geraet1/ok “Noncached”); under gateway V1 the subscription of the topic group is enough. Text topics belong to a virtual text input."
