W_PBAT = "pbat/ibat: -1 can also be a real value – read together with geraet1_ok."
K_KOPIEREN = "Copy"
B_TITEL = "Commands through the MQTT gateway V2 (command bridge)"
B_TEXT = "Set an override, sign of life, automatic, hold and immediate poll from Loxone through the MQTT gateway V2 – without a token in the project file. Prerequisite in the plugin: “Publish values via MQTT” and “Accept commands via MQTT” (MQTT tab), for intervening commands “Allow writing commands”. Limits, state of charge window, temperature protection, write brake and writer guard apply as on the HTTP way."
B_AUSGANG = "Output “LoxBerry MQTT-Gateway”: virtual output with the address <span class='sm-mono'>/dev/udp/%s/%d</span>; one virtual output command per command, “command on” as below. <b>Never “retain”.</b>"
