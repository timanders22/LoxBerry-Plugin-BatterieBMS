BL_HW9 = "-1 means “no statement”, -999 for temperatures; #44 to #47 make sure this triggers no alert. “Lebenszeichen fehlt” (#42) reports when the service, the gateway or MQTT in the plugin stand still. Send reconnect to the gateway at system start (page “LoxBerry MQTT-Gateway”)."
BL_HS8 = "The status (#18) only says “charging” when the plugin really has set the override (running override 1, #19) – otherwise “requested but not set”: the plugin rejects (temperature, state of charge or release; Test tab)."

