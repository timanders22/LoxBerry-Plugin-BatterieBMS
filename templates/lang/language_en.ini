VORLAGE_UNGEMESSEN = "<b>This selection is not based on a measurement yet.</b> The battery has not answered successfully so far, so all measurements are listed here as a precaution. As soon as the first poll succeeds, the table shows only the values this device actually delivers - download the import file again at that point."
MQTT_ERSTER_SCHRITT_AUS = "<b>First step for the MQTT way:</b> tick Publish values through the MQTT gateway on the MQTT tab. It is off by default and is currently <b>off</b> — the plugin sends nothing."
MQTT_ERSTER_SCHRITT_EIN = "<b>First step for the MQTT way:</b> Publish values through the MQTT gateway on the MQTT tab is <b>on</b>."
FEHLER_VORLAGE_NR = "The battery number for the template must be 1 to 6 - no template generated."
VON_HINWEIS = "<b>Writer watch:</b> every address above carries <span class='sm-mono'>&amp;von=loxone</span> – this is how the plugin tells the Miniserver from other writers. For existing commands in Loxone Config it is enough to append <span class='sm-mono'>&amp;von=loxone</span> by hand (importing again creates duplicate blocks). The operating mode address is meant for EVCC and carries <span class='sm-mono'>&amp;von=evcc</span>. Every address still works without <span class='sm-mono'>von</span>."
BL_WERTE = "Values and alerts"
BL_SPOT = "Charging by spot price"
BL_SO_TITEL = "How to take over this page"
BL_HINWEISE = "Notes"
BL_W1 = "Values through the MQTT gateway V2: switch on “Publish values via MQTT” on the MQTT tab and tick the data points of the tick list in the MQTT gateway V2 (status/ok and geraet1/ok “Noncached”)."
BL_W2 = "Create a page “BatterieBMS” and create the virtual inputs #1–#6, #22–#29 and #40 with the names from the name table (Loxone integration tab) – do not tick “Use as digital input”; the command “BMS: Automatik (Zwang beenden)” (#21) at the output “LoxBerry MQTT-Gateway”."
BL_W3 = "Create virtual input #20 “Zwang beenden”: Periphery → Virtual inputs, input type push button, “Use in visualisation” on."
BL_W4 = "Create three notifications (#12, #19, #39): Periphery → Messages → Notification, names as in the table, then drag them onto the page."
BL_W5 = "Place the remaining blocks through the block search (F5) – among them constant #41 and analogue value validation #42 (untick “En”) –, set the parameters as in the table and wire every row as given in the last column."
BL_W6 = "For “BMS: Automatik (Zwang beenden)” to work: tick “%s” on the MQTT tab, tick “%s” on the Settings tab and set the column “%s” to yes for the battery."
BL_HW1 = "All faults run through OR into one notification; a notification block gets only one source."
BL_HW2 = "The on-delays only report when the fault persists – a single missed poll or short warning bits on load changes stay silent."
BL_HW3 = "“Meldung Akku prüfen” reports cell drift (only after 30 minutes), health below 80 percent or a cell above 45 °C; match the drift threshold to the warning threshold on the Settings tab. Drift is meaningful at rest – under load even healthy cells briefly drift apart."
BL_HW4 = "“Meldung BMS-Alarm” reports what the BMS itself reports (fault and warning bits), a cell below the charge limit and an incomplete override; the Test tab shows the details."
BL_HW5 = "“Zwang beenden” is a push button in the app and sends “BMS: Automatik (Zwang beenden)”."
BL_HW6 = "Status: the first line that holds wins; the line without condition stands at the bottom."
BL_HW7 = "An output command may be inserted only once in Loxone: “BMS: Automatik (Zwang beenden)” stands only on this page, “BMS: Laden erzwingen (W)” and “BMS: Lebenszeichen” only on the second. Virtual inputs such as batteriebms_geraet1_ok may stand on both pages."
BL_HW8 = "If you have set the poll interval above 36 s, set On of “Werte veraltet” (#8) to five times the interval and Off 30 s below it."
BL_S1 = "Create a second page “BatterieBMS Spotpreis-Laden” in Loxone Config."
BL_S2 = "Spotpreis aWATTar: create the virtual input spot_awattar_cur with the name from the name table of the plugin Spotpreis aWATTar – the final price (with grid fees, levies and VAT), the same quantity as haus/strompreis/aktuell."
BL_S3 = "Drag the virtual inputs batteriebms_geraet1_ok and batteriebms_geraet1_soc a second time (#1, #2), spot_awattar_cur (#3) and batteriebms_geraet1_sollart (#19) onto the page; create the commands “BMS: Laden erzwingen (W)” (#14) and “BMS: Lebenszeichen” (#17) at the output “LoxBerry MQTT-Gateway”."
BL_S4 = "Create virtual inputs (Periphery → Virtual inputs, “Use in visualisation” on): three sliders #4, #6 and #12 with Min, Max and step as in the table (unit: #4 <v.1> ct/kWh, #12 <v> W, #6 <v> %) and one switch #8."
BL_S5 = "After saving, set the start values once in the app (28 ct/kWh, 80 percent, 2000 W) – Loxone only sends a value when it changes."
BL_S6 = "Place the remaining blocks through F5 (2 Less than, 4 AND, 1 Formula, 1 Pulse generator, 1 Status) and wire every row as given in the last column."
BL_S7 = "Tick “%s” on the MQTT tab, tick “%s” on the Settings tab and set the column “%s” to yes for the battery; leave the dead man time (300 s by default) as it is."
BL_HS1 = "Loxone sends “BMS: Laden erzwingen (W)” only when the value changes. When the override ends, the formula goes to 0, and 0 hands control back to the battery."
BL_HS2 = "The keep alive holds the override. If it stays away longer than the dead man time (Miniserver or network gone), the battery returns to automatic on its own."
BL_HS3 = "“Less than” has no hysteresis: at the target state of charge the override may switch on and off a few times in a cheap hour; the write brake of the plugin (20 s by default) limits that."
BL_HS4 = "spot_awattar_cur is the final price with grid fees, levies and VAT – the start limit of 28 ct/kWh fits it. Do not use together with “Spot price charging in the plugin” (Settings tab) – commands from Loxone take precedence there."
BL_HS5 = "Do not set the charge power above the power limit of the battery on the Settings tab – a higher value is rejected, not capped."
BL_HS6 = "Percentages are called ‘(Proz)’ in names because Config turns ‘%’ into ‘_’ – e.g. the slider “Ziel-Ladezustand (Proz)”."
BL_HS7 = "Faults are reported by the first page (Meldung BMS gestört; an incomplete override through Meldung BMS-Alarm) – this page has no notification of its own."
