FEHLER_AUSWAHL_ZEILE = "Row %d: %s carries a value the selection does not offer."
FEHLER_ZEILE_REST = "Row %d: profile, name, address and device file are empty, but %s is filled in. To remove the battery, clear these fields as well (Write ‘No’, sign normal); otherwise choose a profile."
H_WACHE = "Writer watch"
WACHE_ERKLAERUNG = "Only <b>one</b> controller should drive the battery. For every switching command at the endpoint the watch notes who sent it: the identifier from <span class='sm-mono'>&amp;von=</span> (the Loxone template sets <span class='sm-mono'>von=loxone</span>, the EVCC address <span class='sm-mono'>von=evcc</span>) and the sender address. If commands from more than one writer arrive within the time window, this shows up in the log, in the Test tab and at the end of the reply (<span class='sm-mono'>;SCHREIBER=n</span>). <b>By default nothing is rejected.</b> Only “Reject foreign writers” rejects – never a release (automatik, watt=0, batteriemodus=1)."
L_WACHE_EIN = "Report several writers"
H_WACHE_EIN = "On by default. Changes nothing at the battery; only writes log lines (throttled) and the table in the Test tab."
L_WACHE_FENSTER = "Time window of the watch (minutes)"
H_WACHE_FENSTER = "1 to 120, default 15 (three dead-man periods). Two writers within this time count as several."
L_WACHE_LB = "Also as a LoxBerry notification"
H_WACHE_LB = "Off by default. A new round of writers then also appears in the LoxBerry notification area, once per round."
L_FUEHRUNG = "Lead"
H_FUEHRUNG = "Who sets setpoints? <b>Loxone and EVCC</b> (default, as before): both. <b>Loxone</b>: setpoints from EVCC (<span class='sm-mono'>aktion=batteriemodus</span> or <span class='sm-mono'>von=evcc</span>) and from other identifiers are reported, and rejected with “Reject foreign writers”. <b>EVCC</b>: the other way round. Without an identifier, batteriemodus counts as EVCC and everything else as Loxone. Releases are never affected."
FUEHRUNG_BEIDE = "Loxone and EVCC (as before)"
FUEHRUNG_LOXONE = "Loxone"
FUEHRUNG_EVCC = "EVCC"
L_WACHE_SPERREN = "Reject foreign writers (HTTP 409)"
H_WACHE_SPERREN = "Off by default. Only switch it on after the Test tab has shown just the expected writers for a week. A setpoint whose side does not lead, or whose writer is not on the list, then gets HTTP 409 <span class='sm-mono'>GRUND=FREMDSCHREIBER</span> and is not carried out. Releases always pass. A Loxone template without <span class='sm-mono'>von=loxone</span> appears as “no identifier”: it counts as Loxone but does not match a list that only contains “loxone”."
L_WACHE_ERLAUBT = "Allowed writers (optional)"
H_WACHE_ERLAUBT = "Identifier (loxone), address (192.168.178.10) or both as identifier@address, separated by commas, at most 16. Empty: only the lead decides. With “Loxone and EVCC” as lead, rejecting needs at least one entry."
FEHLER_WACHE_LISTE = "Allowed writers: not understood: %s. Allowed are an identifier (1 to 32 characters A-Z a-z 0-9 _ -), an address or identifier@address, at most 16."
FEHLER_WACHE_LISTE_FORM = "Allowed writers: text with at most 512 characters expected."
FEHLER_FUEHRUNG = "Lead: allowed are beide, loxone and evcc."
FEHLER_WACHE_LEER = "“Reject foreign writers” needs a lead (Loxone or EVCC) or at least one allowed writer – otherwise the lock has nothing to tell foreign from allowed."
WAS_IST_DAS = "<b>Reads the battery management system of a home battery directly</b> – state of charge, state of health, cell voltages and temperatures, cell drift, cycles. A service on the LoxBerry polls the batteries over Modbus TCP or RTU or the RS485 console (BYD Battery-Box, Huawei LUNA2000, Pylontech, freely configurable through profile files). The values reach the Miniserver over MQTT and a token-protected HTTP endpoint; once enabled twice, the plugin can also force a battery to charge or discharge, for example with a dynamic tariff – with power limit, charge window and dead man switch."
H_SPOTLADEN = "Spot price charging in the plugin (haus/strompreis)"
SPOTLADEN_ERKLAERUNG = "The plugin charges the battery itself when the electricity price of the spot price plugin (final price) is below the limit. Do not use together with the Loxone page ‘BatterieBMS Spotpreis-Laden’ – commands from Loxone take precedence. The source is haus/strompreis (Spotpreis aWATTar from 1.2.39); if it stays silent for more than 120 s, the plugin only withdraws its own override. Only with lead “Loxone and EVCC” and “Allow writing commands”; temperature protection and state of charge window apply. Off by default."
L_SPOTLADEN_EIN = "Switch on spot price charging in the plugin"
L_SPOTLADEN_GERAET = "Battery number"
L_SPOTLADEN_GRENZE_CT = "Price limit (ct/kWh, final price)"
L_SPOTLADEN_RANG = "only in the k cheapest hours (0 = off)"
L_SPOTLADEN_ZIEL = "Target state of charge (percent)"
L_SPOTLADEN_WATT = "Charge power (W)"
H_SPOTLADEN_GERAET = "Which battery is charged."
H_SPOTLADEN_GRENZE_CT = "<b>Final price</b> – what the household pays per kWh, with grid fees, levies and VAT –, not the exchange part. Default 25 ct."
H_SPOTLADEN_RANG = "Charging only happens when the current hour is among the k cheapest up to the end of the forecast. 0 switches this condition off."
H_SPOTLADEN_ZIEL = "Up to this state of charge; the upper limit of the state of charge window applies as well."
H_SPOTLADEN_WATT = "Mandatory. Not above the charge limit of the battery – a higher value is rejected."
H_AUSGLEICH = "Balancing charge (cell balancing)"
AUSGLEICH_ERKLAERUNG = "A deliberate, one-off maintenance charge to 100 percent when the cells drift apart (cell drift above the start threshold in two consecutive cell readings). Only with lead “Loxone and EVCC”, without another override, with “Allow writing commands” and not before the interval. Temperature protection applies; any command from outside aborts it. The upper limit of the state of charge window does not apply to this charge. <b>Not measured on a device</b> – switch it on under supervision first. Off by default."
L_AUSGLEICH_EIN = "Switch on balancing charge"
L_AUSGLEICH_START_MV = "Start threshold cell drift (mV)"
L_AUSGLEICH_RUECK_MV = "Return threshold (mV)"
L_AUSGLEICH_WATT = "Charge power (W)"
L_AUSGLEICH_MAX_MIN = "Maximum duration (min)"
L_AUSGLEICH_ABSTAND_TAGE = "Not again before (days)"
H_AUSGLEICH_WERTE = "Defaults: start 80 mV, return 30 mV, at most 240 min, at most every 7 days. The return threshold must be at least 10 mV below the start threshold; the charge power is mandatory."
FEHLER_SPOT_WATT = "Spot price charging: the charge power is mandatory (greater than 0 W)."
FEHLER_AUSGLEICH_WATT = "Balancing charge: the charge power is mandatory (greater than 0 W)."
FEHLER_AUSGLEICH_RUECK = "Balancing charge: the return threshold must be at least 10 mV below the start threshold."
FEHLER_PROFIL_LEER = "Field %s: “leer” must be an integer or a list of integers."
FEHLER_PROFIL_OPTIONAL = "A read block carries “optional” – only true and false are allowed."
FEHLER_VERWERFEN_HAKEN = "To discard, tick “Checked on the device” – otherwise nothing happens."
FEHLER_VERWERFEN_NR = "Invalid battery number – nothing discarded."
H_VERWERFEN = "Open overrides"
VERWERFEN_ERKLAERUNG = "These are setpoint files whose override has not been withdrawn yet. <b>Override checked on the device – discard setpoint:</b> the plugin writes NOTHING to the battery. Only discard when the battery is back in automatic on the device. The file is put aside as soll_geraetN.verworfen.json and noted in the log."
T_VERWERFEN_LAGE = "Withdrawal by the plugin"
VERWERFEN_AUFLOESBAR = "possible – the service is trying"
VERWERFEN_UNAUFLOESBAR = "not possible (no withdrawal steps or battery removed) – check on the device"
L_VERWERFEN_OK = "Checked on the device"
K_VERWERFEN = "Override checked on the device – discard setpoint"
VERWERFEN_KEINE = "Battery %d: no open setpoint file."
VERWERFEN_FEHL = "Battery %d: the setpoint file could not be put aside."
VERWERFEN_LOG = "Setpoint of battery %d discarded in the web interface (override checked on the device, nothing written to the battery). Content: %s"
VERWERFEN_OK = "Battery %d: setpoint discarded (put aside as .verworfen.json). Nothing written to the battery."
SICH_SPAET_BEHALTEN = "These settings were not in the backup and stay unchanged: %s"
DIENST_STOP_ZWANG = "Service stopped – but an override has not been withdrawn; the service restarts within a minute and tries again. Check on the device; if the override is already cancelled there: “discard setpoint” (section Open overrides)."
DIENST_STOP_UNAUFLOESBAR = "Service stopped – an open override cannot be withdrawn with this plugin; the watchdog does not restart the service for it. Check on the device and “discard setpoint” in the section Open overrides."

