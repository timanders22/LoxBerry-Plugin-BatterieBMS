ENDPUNKT_NEU_HINWEIS = "Not needed for new installations: values through the MQTT gateway V2 (name table above), commands through the command bridge. The HTTP read branch is the old way for existing project files (steps 3 and 4 below)."
L_ENDPUNKT_EIN = "Accept the HTTP read branch for Loxone"
H_ENDPUNKT_EIN = "Off by default on a new installation; an existing installation keeps it on update (on). Switched off, status, zellen, liste, summe and roh answer with 403; evcc (battery meter for EVCC), ?selftest=1 and the switching calls with token stay open."
