[LOX]
ADRESSE_VORSCHLAG = "The address above is a <b>suggestion</b>. The host name your browser is using right now need not be the one the Miniserver uses to reach the LoxBerry. When in doubt enter the fixed IP address of the LoxBerry."
EINLEITUNG = "This page builds the integration step by step. Working through it from top to bottom leaves you with a battery that reports its cell voltages to Loxone and can be forced to charge by the Miniserver."
H_TITEL = "Loxone integration"
IMPORT_WARNUNG = "<b>Loxone Config creates new objects on import and overwrites nothing.</b> Importing twice means duplicate objects. Delete the old ones before a second import."
K_TOKEN_NEU = "Roll a new token"
K_VORLAGE_AUS = "Import file virtual output"
K_VORLAGE_EIN = "Import file virtual inputs"
L_VORLAGE_GERAET = "For which battery?"
MEHRERE = "Several batteries: one virtual input per battery, each with its own address."
S1_TEXT = "There are two ways and they do not exclude each other. <b>MQTT is the standard way:</b> the gateway creates the names of the virtual inputs itself, so a suitably named input in Loxone is enough. <b>The HTTP endpoint</b> is the second way; you need it anyway as soon as Loxone is to switch something, and for status values it is often clearer because one request returns everything at once. If you only watch, use MQTT. If you control, set up both."
S1_TITEL = "Step 1: Choose the way"
S2_TEXT = "Only needed if you use the MQTT way. In the LoxBerry under <b>System &rarr; MQTT Gateway</b> add this subscription:"
S2_TITEL = "Step 2: Add the subscription in the MQTT gateway"
S2_WARNUNG = "<b>Without this entry nothing arrives at the Miniserver.</b>"
S3_BEFEHLE = "<p>The command recognitions for the virtual input. The button below generates them ready made as an import file &mdash; the table stays all the same, because it explains what is being imported.</p>"
S3_STRICH = "A <b>dash</b> instead of a number means the battery did not supply this field. No 0 is sent on purpose, because a 0 would be a silent false statement. On a dash Loxone keeps the previous value."
S3_TEXT = "In Loxone Config create a <b>Virtual HTTP Input</b>. Address and polling cycle:"
S3_TITEL = "Step 3: Create the virtual inputs"
S4_TEXT = "Only needed if Loxone is to force the battery to charge or discharge. Create a <b>Virtual Output</b> with one command each below it. The value placeholder for the power is <span class='sm-mono'>&lt;v.0&gt;</span> in Loxone."
S4_TITEL = "Step 4: Sending commands"
S4_WARNUNG = "<b>watt=0 is not the same as charging with 0 watts:</b> it ends the forced mode and hands control back to the battery. A value above the configured limit is <b>rejected</b>, not clamped &mdash; otherwise the Miniserver would believe more had been sent. <b>After importing, check</b> that every command has GET set as its method: the verified samples in the working folder are UDP outputs and carry no such attribute, so the import file does not write one either."
S5_TEXT = "The endpoint sits in the unauthenticated area so that Loxone can reach it without credentials. It is protected by the token embedded in every address."
S5_TEXT2 = "<p><b>A new token invalidates every address in the Miniserver.</b> After rolling one you have to update them by hand in Loxone Config. So only roll one if the token has genuinely leaked.</p>"
S5_TITEL = "Step 5: Token and dead man switch"
S6_TEXT = "Virtual inputs in Loxone keep their last value. If the battery fails, everything looks normal in the app &mdash; the state of charge merely stops moving. Two values give it away: <span class='sm-mono'>ALTER</span> rises and <span class='sm-mono'>OK</span> drops to 0. Both belong in your logic, see blocks 7 to 13 below. <b>Set the fault threshold well above the poll interval</b> so that a single missed cycle triggers nothing."
S6_TITEL = "Step 6: Failure detection"
S7_ERLAEUTERUNG = "<h3>On the individual rows</h3><p><b>On 9 and 10:</b> Two different failure pictures. #9 means the service runs but no longer fetches fresh values. #10 means the service runs and explicitly reports that the battery is not answering. Both lead to the same message, which is why they are merged in #11.</p><p><b>On 11:</b> <b>Never wire several sources straight into the input of the notification block.</b> It only fires on a change from off to on; a permanently active source would swallow all the others. Merge them through OR first.</p><p><b>On 12 and 15:</b> The on delay is not decoration. Without it the installation reports on every single missed poll and on every load peak that briefly pulls the cell voltages apart.</p><p><b>On 14:</b> The spread between highest and lowest cell voltage is the value you read a BMS for in the first place. Under load it widens even on healthy cells &mdash; it is meaningful at rest. To be precise, also gate #14 on battery power being close to zero.</p><p><b>On 21:</b> The spot price comes from the Spotpreis aWATTar plugin or an equivalent source. Without a dynamic tariff, drop 21 to 25 and drive 27 from the flag 26 alone.</p><p><b>On 27:</b> All three conditions must hold: the price is low, the battery is not full enough yet, and the release flag is set. If one drops out, the forced mode ends.</p><p><b>On 30 to 32 and 36:</b> This is the dead man switch. While the forced mode is meant to run, the pulse generator sends a keep alive at regular intervals. <b>The interval must be clearly shorter than the configured dead man time</b> &mdash; a third is a workable value. If the keep alive stops because the Miniserver fails or the network drops, the battery returns to automatic on its own. Without this part a forced charge stays in place until somebody notices.</p><p><b>On 34 and 35:</b> When the condition ends, automatic is sent <b>explicitly</b> instead of waiting for the dead man time. The dead man switch is the net below, not the normal path.</p><p><b>Loxone time base:</b> Loxone counts seconds since 2009-01-01. If a time block supplies Unix time (a value around 1.7 billion), subtract <span class='sm-mono'>1230768000</span>.</p><p>Loxone Config finds every block through the block search with <b>F5</b>.</p>"
S7_TEXT = "<b>Mandatory part.</b> Working through this table from top to bottom rebuilds the function without having to think. Rows 1 to 20 are the monitoring and are always worth it. Rows 21 to 36 are spot price charging including the dead man switch &mdash; they can be left out if you only want to watch."
S7_TITEL = "Step 7: Complete block list for rebuilding"
S8_TEXT = "Call these four addresses in a browser. The first must return values, the other three must be rejected. If one of the last three is answered, something is wrong with the endpoint."
S8_TITEL = "Step 8: Cross check"
TOKEN_NEU = "A new token has been rolled. Every address in the Miniserver has to be updated now."
