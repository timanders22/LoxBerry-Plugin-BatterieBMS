[BM_PROFIL]
H_BYD = "The BCU listens on the fixed address 192.168.16.254 and therefore sits outside the home network. Add a static route for 192.168.16.0/24 via the DHCP address of the box in your router. Only ONE application can talk to the box at a time: while BE Connect Plus or a Node-RED flow is running, this plugin is locked out."
H_GENERISCH = "Template to download and adapt. Your own profile is a JSON file in the profile folder and needs no change to the source code."
H_HUAWEI = "Through the Smart Dongle on port 502, on the inverter WLAN access point on 502 or 6607 depending on firmware. There is no direct access to the BMS: the inverter passes through what it passes through."
H_HUAWEI_PAKETE = "Since 0.9.16 the register addresses follow the manufacturer document (Solar Inverter Modbus Interface Definitions, SUN2000MA, table 3-2), cross-read against huawei-solar-lib. They have not been measured against a device here. Up to 0.9.15 seven of the eight addresses were wrong: the battery returned numbers, but the wrong ones. Cell voltages and a pack SOH do not exist in this address range and have been removed. Check them with the raw register reader in the Test tab against the FusionSolar app before use."
H_PYLONTECH = "RS485 console, not Modbus. A USB to RS485 adapter on the LoxBerry, 115200 baud for US2000C and newer, 9600 for older revisions. The protocol carries no state of health: it is computed from the reported total capacity and the nominal capacity you enter."
H_SUNGROW = "Sungrow SBR through the SH hybrid inverter (Modbus TCP, port 502, unit ID 1) – <b>unchecked on a device</b>. Register data from the Sungrow protocol V1.1.11 (protocol addresses = document minus 1, read with FC 4). No cell temperature: temperature protection uses the pack temperature. The sign of the power is not described in the document – check the “sign” switch on the device. Writing: forced mode through 13049/13050/13051; “hold” is discharging with 0 W (not measured on a device)."
H_VICTRON = "Victron GX (Cerbo, Venus) – battery service, for example Pylontech over CAN. <b>Unchecked on a device.</b> Unit ID 225 by default; since Venus 2.60 the GX assigns it per installation – read it under Settings → Integrations → Modbus TCP server → Available services and enter it for the battery. Read only: the GX register list has no battery setpoint in W."

