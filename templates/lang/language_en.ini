EVCC_ERKLAERUNG = "EVCC charges electric cars and wants to know what the home battery is doing — and to hold it during a fast charge so the battery does not empty into the car. For that there are three values under <span class='sm-mono'>evcc/</span> and, at the endpoint, the actions <span class='sm-mono'>evcc</span> (read) and <span class='sm-mono'>batteriemodus</span> (switch). <b>Holding here means forced discharge at zero watts</b> — no new register, just the profile's discharge steps with 0 W. The dead-man switch still applies: if EVCC goes away, the battery falls back to automatic after the configured time."
EVCC_VORZEICHEN = "<b>Mind the sign.</b> This plugin counts <span class='sm-mono'>pbat</span> positive when charging. EVCC counts the other way round: negative = charging. That is why <span class='sm-mono'>evcc/power</span> carries the inverted sign. Anyone using <span class='sm-mono'>pbat</span> instead must add <span class='sm-mono'>scale: -1</span> in EVCC — otherwise EVCC takes charging for discharging and back, without any error showing anywhere."
