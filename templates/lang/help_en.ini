; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "Home battery storage (BMS)"
K02 = "Reads the <b>battery management system</b> of a home battery directly — cell voltages, cell temperatures, cycle count and state of health — and can force the battery to charge or discharge on demand."
K03 = "The inverter usually passes on only a fraction of this. If you want to know whether a single cell is dropping off, you have to ask the BMS itself."
K04 = "Three transmission paths"
K05 = "<b>Modbus TCP</b> — Huawei LUNA2000 through the SUN2000 inverter, port 502 on the Smart Dongle."
K06 = "<b>Modbus RTU inside a TCP stream</b> — the BYD BCU on <span class='sm-mono'>192.168.16.254:8080</span>. That is not a typo: the box speaks RTU frames without an MBAP header. It also sits in a subnet of its own, so the router needs a <b>static route</b> to <span class='sm-mono'>192.168.16.0/24</span>. And only <b>one</b> application at a time can reach the box: as long as BE Connect Plus or a Node-RED flow is running, this plugin stays outside."
K07 = "<b>RS485 console</b> — Pylontech US2000, US3000, US5000 and Force. Not Modbus but an ASCII protocol of its own. A USB-to-RS485 adapter on the LoxBerry is enough; the user <span class='sm-mono'>loxberry</span> has to be in the <span class='sm-mono'>dialout</span> group."
K08 = "How to proceed"
K09 = "<b>Settings:</b> enter the battery, choose a profile, save, then <i>Start service</i>."
K10 = "<b>Test:</b> the self-check tells you line by line whether it holds. Every failed line names the remedy."
K11 = "<b>Test, read raw registers:</b> before you trust a profile — read the register and hold the value against what the manufacturer displays."
K12 = "<b>MQTT:</b> the plugin enters the subscription <span class='sm-mono'>batteriebms/#</span> (or its own prefix) itself in <span class='sm-mono'>config/plugins/batteriebms/mqtt_subscriptions.cfg</span>, on save and on service start. <b>With MQTT&#8209;gateway&nbsp;V1</b> nothing arrives at the Miniserver without this subscription. Whether version&nbsp;2 also detects the topic group without the file has not been measured."
K13 = "<b>Loxone integration:</b> step by step, with a complete list of blocks and a button that generates the import file for Loxone Config."
K14 = "Profiles"
K15 = "Every device profile states <b>where its register addresses come from</b> and whether they have been checked against a device. Profiles marked <i>unverified</i> are in circulation but have not been measured — they are offered so that you can try them out, not so that you believe them."
K16 = "A profile of your own is a <b>JSON file</b> in the folder <span class='sm-mono'>data/plugins/batteriebms/profile/</span> and needs no change to the source. On the Settings tab a button downloads any existing profile as a starting point."
K17 = "Control and dead man's switch"
K18 = "Writing commands need <b>two</b> releases: the tick on the Settings tab and the <i>Write</i> column for the individual battery. A value above the configured limit is <b>rejected</b>, not clipped."
K19 = "A running forced cycle ends by itself if no sign of life arrives for longer than the <b>dead man time</b>. Loxone sends that sign of life on the beat of a pulse generator — if the Miniserver fails, the network drops out or the service is stopped, the battery returns to automatic mode. Without this part a forced charge would stay in place until somebody noticed."
K20 = "What this version cannot prove"
K21 = "It has not been measured against <b>any</b> battery. What is proven are the protocols (frame construction and checksums were held against the original implementations) and the register addresses of the profiles marked <i>documented</i>. What is not proven is whether they match your device firmware and whether the write commands there do what their name says."
K22 = "<b>Publish via MQTT:</b> if you connect through MQTT, first tick Publish values through the MQTT gateway on the MQTT tab. It is <b>off</b> by default - without it the plugin sends nothing, even while service and gateway are running."
K23 = "<b>State of charge window during an override:</b> if the battery reaches the lower limit during a forced discharge or the upper limit during a forced charge, the service takes the override back (automatic) and writes a line to the log."
K24 = "<b>Taking back is never blocked:</b> <span class='sm-mono'>automatik</span>, <span class='sm-mono'>watt=0</span>, the dead man switch and stopping the service return the battery even while writing is disabled. The releases only block <b>setting</b> an override - a keep alive is then rejected as well, and the dead man switch ends the override."
K25 = "<b>Rebuilding the battery list:</b> for every override the service remembers the address of the battery. While an override runs, saving rejects a change that would push that battery off its number. If it drops out of the list anyway (backup, broken configuration), the service takes the override back through the stored address or reports loudly that it could not."
K26 = "<b>Stop, update, uninstall:</b> <span class='sm-mono'>dienst.sh stop</span> waits twice the timeout per battery (at least 10 s). If an override stays open, it reports this with the battery name and return code 3, and the run flag stays so that the service tries again. An update backs up open setpoints and restores them, update and uninstall report an open override as a warning. After an uninstall nobody takes an override back any more - then set the device to automatic by hand. SOLLART 4 means incomplete: a step sequence broke off and taking it back failed as well."
K27 = "MQTT: what is sent and what is cleared"
K28 = "Only changes are sent, the full set at most every 10 minutes, the keep alive <span class='sm-mono'>ts</span> at most every 30 s. Retained topics are cleared once when a battery drops out of the list (<span class='sm-mono'>geraetN/</span>), EVCC is switched off (<span class='sm-mono'>evcc/</span>), the prefix changes (the old prefix, which is recorded and cleared once more on uninstall) or MQTT is switched off (the own prefix). If only the BMS fails, the states stay and <span class='sm-mono'>ok</span> becomes 0."
