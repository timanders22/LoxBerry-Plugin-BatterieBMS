[AUTOUPDATE]
# Diese Datei liegt im Wurzelverzeichnis des GitHub-Repositories und steuert
# das Auto-Update. Bei jedem Release VERSION und BEIDE Adressen auf den neuen
# Tag anpassen - und danach nachpruefen, dass der Tag wirklich existiert.
#
# Solange keine eigene Vorabfassung gepflegt wird, steht hier dieselbe Fassung
# und dieselben Adressen wie in der release.cfg. Sonst bekommt jemand, der
# Vorabfassungen einschaltet, eine Adresse auf ein Archiv angeboten, das es
# nicht gibt. Eine prerelease.cfg OHNE VERSION-Zeile waere der schlechteste
# Fall: wird sie doch einmal abgerufen, ist das Verhalten undefiniert.

VERSION=0.9.16
ARCHIVEURL=https://github.com/timanders22/LoxBerry-Plugin-BatterieBMS/archive/refs/tags/v0.9.16.zip
INFOURL=https://github.com/timanders22/LoxBerry-Plugin-BatterieBMS/releases/tag/v0.9.16
